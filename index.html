<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Submit leave requests, review them against a team calendar, and track approval status.">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Leave Planner &amp; Approval Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: quiet top bar, three screens. Cool grey-green ground, white hairline cards, one warm orange that only marks what needs the lead's attention. Leave is drawn as continuous bars (month) or one row per person (timeline). */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#F6F8F7; --ink:#1E2928; --muted:#5C6B69; --line:#DFE6E4;
  --accent:#C2540A; --accent-soft:#FCEBDD; --accent-line:#EBB387; --on-accent:#FFFFFF;
  --ok:#2B6B55; --ok-soft:#E0F0E9; --ok-fill:#2B6B55; --on-ok:#FFFFFF;
  --no:#98414B; --no-soft:#F6E3E5;
  --shadow:0 1px 2px rgba(30,41,40,.05),0 8px 24px rgba(30,41,40,.04);
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131A1A; --surface:#1B2424; --surface-2:#172020; --ink:#E7EEEC; --muted:#94A4A1; --line:#2C3838;
    --accent:#F0894A; --accent-soft:#3A2515; --accent-line:#7A4A27; --on-accent:#1A1008;
    --ok:#7CCBB0; --ok-soft:#1B3A30; --ok-fill:#5BB89B; --on-ok:#0B1A15;
    --no:#E39AA2; --no-soft:#3D2428;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.2); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131A1A; --surface:#1B2424; --surface-2:#172020; --ink:#E7EEEC; --muted:#94A4A1; --line:#2C3838;
  --accent:#F0894A; --accent-soft:#3A2515; --accent-line:#7A4A27; --on-accent:#1A1008;
  --ok:#7CCBB0; --ok-soft:#1B3A30; --ok-fill:#5BB89B; --on-ok:#0B1A15;
  --no:#E39AA2; --no-soft:#3D2428;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.2); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shell{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--font-display);font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:28px;line-height:1.15} h2{font-size:19px} h3{font-size:16px}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
button{font:inherit;color:inherit}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.tabs{display:flex;gap:4px;padding:4px;background:var(--line);border-radius:12px;max-width:100%}
.tabs a{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:600;display:inline-grid;place-items:center}
.badge[hidden]{display:none}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* cards, type, fields */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow);min-width:0}
.sub{color:var(--muted);margin-top:6px;max-width:60ch}
.head{display:flex;flex-direction:column;gap:4px;margin-bottom:4px}
.muted,.meta{color:var(--muted)} .meta{font-size:14px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ok{background:var(--ok-fill);border-color:var(--ok-fill);color:var(--on-ok)}
.btn.rej{color:var(--no);border-color:var(--no)}
.btn.ghost{background:transparent}
.btn.sm{height:36px;padding:0 14px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default;pointer-events:none}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.opt{font-weight:400}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
form{display:flex;flex-direction:column;gap:16px;margin-top:20px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.err{color:var(--no);background:var(--no-soft);padding:10px 12px;border-radius:10px;font-size:14px}

/* request screen */
.submit-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.dur{display:flex;gap:16px;align-items:center;padding:16px;border-radius:12px;background:var(--accent-soft)}
.dur.idle{background:var(--surface-2);border:1px dashed var(--line)}
.dur.bad{background:var(--no-soft)}
.dur-num{font-family:var(--font-display);font-weight:700;font-size:44px;line-height:1;color:var(--accent);min-width:48px;text-align:center}
.dur.idle .dur-num{color:var(--muted)} .dur.bad .dur-num{color:var(--no)}
.dur-t{font-weight:600} .dur-s{font-size:13px;color:var(--muted)}
.formfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--line)}
.total{font-size:14px;color:var(--muted)} .total b{color:var(--ink);font-size:16px}
.side-list{display:flex;flex-direction:column;margin-top:14px}
.side-item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.side-item:first-child{border-top:0}
.dayspill{white-space:nowrap;font-size:13px;color:var(--muted)}
.done{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.done .tick{width:44px;height:44px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.done .summary{border:1px solid var(--line);border-radius:12px;padding:14px 16px;width:100%;background:var(--surface-2)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}

/* cover check strip (form, review preview, sheet) */
.preview{padding:12px 14px;border-radius:12px;font-size:14px;display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line)}
.preview.warn{background:var(--accent-soft);border-color:var(--accent-line)}
.preview.fine{background:var(--ok-soft);border-color:transparent}
.preview .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:var(--muted)}
.preview.warn .dot{background:var(--accent)} .preview.fine .dot{background:var(--ok-fill)}

/* review screen */
.review-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(290px,1fr);gap:20px;align-items:start}
.calbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.calnav{display:flex;align-items:center;gap:6px}
.calopts{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.iconbtn:hover{border-color:var(--muted)}
.monthlbl{font-family:var(--font-display);font-weight:600;font-size:22px;min-width:9ch}
.seg{display:flex;padding:3px;gap:2px;background:var(--line);border-radius:10px}
.seg button{border:0;background:none;height:30px;padding:0 12px;border-radius:7px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.limit{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:400}
.limit select{width:auto;min-height:34px;padding:2px 8px;font-size:14px}
.review-grid .preview{margin:16px 0 14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:10px;border-radius:3px;display:inline-block}
.sw.ok{background:var(--ok-fill)}
.sw.pend{border:1.5px dashed var(--accent)}
.sw.sel{background:var(--accent)}
.sw.over{background:var(--accent-soft);border:1px solid var(--accent-line);height:12px;width:14px}
.calnote,.hint{font-size:13px;color:var(--muted);margin-top:12px}

/* month view: continuous bars */
.mcal{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.dowrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--surface-2)}
.dow{padding:8px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.week{position:relative;border-top:1px solid var(--line);min-height:96px}
.wbg{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.bgc{border-left:1px solid var(--line)} .bgc:first-child{border-left:0}
.bgc.wk,.bgc.hol{background:var(--surface-2)}
.bgc.over{background:var(--accent-soft)}
.wfg{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:3px;padding-bottom:8px;align-content:start}
.dh{grid-row:1;padding:6px 8px 2px;display:flex;flex-direction:column;gap:1px;min-width:0;pointer-events:none}
.dh .top-row{display:flex;justify-content:space-between;align-items:center;gap:4px;min-height:24px}
.num{font-size:13px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:99px}
.dh.out .num{opacity:.4}
.dh.today .num{background:var(--ink);color:var(--bg)}
.tag{font-size:11px;font-weight:600;color:var(--accent);white-space:nowrap}
.hol-l{font-size:11px;color:var(--muted);line-height:1.2}
.bar{border:0;height:24px;display:flex;align-items:center;padding:0 8px;font-size:12px;font-weight:600;cursor:pointer;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;z-index:1}
.bar.l{margin-left:4px;border-top-left-radius:7px;border-bottom-left-radius:7px}
.bar.r{margin-right:4px;border-top-right-radius:7px;border-bottom-right-radius:7px}
.bar.ok{background:var(--ok-fill);color:var(--on-ok)}
.bar.sel{background:var(--accent);color:var(--on-accent)}
.bar.pend{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent);background-image:repeating-linear-gradient(135deg,transparent 0 6px,var(--accent-soft) 6px 12px)}
.bar:hover{filter:brightness(.94)}
.bar .ini,.tbar .ini{display:none}
.bar span,.tbar span{overflow:hidden;text-overflow:ellipsis}

/* timeline view */
.tl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tl{min-width:max-content;--nw:140px}
.tlrow{display:grid;grid-template-columns:var(--nw) repeat(var(--n),minmax(30px,1fr));border-top:1px solid var(--line);position:relative}
.tlrow:first-child{border-top:0}
.tname{grid-column:1;grid-row:1;position:sticky;left:0;z-index:3;background:var(--surface);padding:0 12px;display:flex;align-items:center;font-weight:500;font-size:14px;min-height:44px;border-right:1px solid var(--line);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc{grid-row:1;border-left:1px solid var(--line);min-height:44px;min-width:0}
.tc.wk,.tc.hol{background:var(--surface-2)}
.tc.over{background:var(--accent-soft)}
.tlhead .tc{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);min-height:52px;gap:1px}
.tlhead .tdn{font-size:13px;font-weight:600;color:var(--ink);width:22px;height:22px;display:grid;place-items:center;border-radius:99px}
.tlhead .tc.today .tdn{background:var(--ink);color:var(--bg)}
.tlhead .tname,.tlcount .tname{background:var(--surface-2);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tlcount .tc{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;min-height:36px;color:var(--muted)}
.tlcount .tc.over{color:var(--accent)}
.tlcount .tname{min-height:36px}
.tbar{grid-row:1;align-self:center;margin:0 2px;height:26px;border:0;border-radius:7px;font-size:12px;font-weight:600;padding:0 8px;display:flex;align-items:center;cursor:pointer;min-width:0;white-space:nowrap;overflow:hidden;z-index:2;text-align:left}
.tbar.ok{background:var(--ok-fill);color:var(--on-ok)}
.tbar.sel{background:var(--accent);color:var(--on-accent)}
.tbar.pend{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent);background-image:repeating-linear-gradient(135deg,transparent 0 6px,var(--accent-soft) 6px 12px)}
.tbar:hover{filter:brightness(.94)}

/* queue */
.queue{display:flex;flex-direction:column;gap:14px;min-width:0}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.count{font-size:13px;color:var(--muted)}
.req{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:10px;cursor:pointer;box-shadow:var(--shadow)}
.req:hover{border-color:var(--muted)}
.req.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.req-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.req-name{font-family:var(--font-display);font-weight:600;font-size:17px}
.req-days{font-size:13px;color:var(--muted);white-space:nowrap}
.req-dates{font-weight:500}
.req-note{font-size:14px;color:var(--muted)}
.req-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.imp{font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.imp.warn{color:var(--accent)} .imp.fine{color:var(--ok)}
.imp i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:32px 16px}
.empty p{color:var(--muted);max-width:34ch}
.decided{display:flex;flex-direction:column}
.decided button.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border:0;border-top:1px solid var(--line);font-size:14px;width:100%;background:none;text-align:left;cursor:pointer;font-family:inherit;color:inherit}
.decided button.row:first-of-type{border-top:0}
.decided button.row:hover{background:var(--surface-2)}
.decided .more{margin-top:8px;align-self:flex-start}

/* decision sheet */
.scrim{position:fixed;inset:0;background:rgba(15,22,22,.5);display:flex;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:30;overflow-y:auto}
.sheet{margin:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:16px;outline:none}
.sheet-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kv dt,.kv dd{margin:0;padding:10px 12px;border-top:1px solid var(--line);font-size:14px}
.kv dt:first-of-type,.kv dt:first-of-type+dd{border-top:0}
.kv dt{color:var(--muted);background:var(--surface-2);padding-right:20px;white-space:nowrap}
.kv dd{text-align:right;font-weight:500;overflow-wrap:anywhere}
.sheet-foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.sheet-foot .linkbtn{margin-right:auto}

/* status screen */
.statusbar{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.who{display:flex;flex-direction:column;gap:6px;min-width:min(260px,100%)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;font-weight:500;color:var(--muted)}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:14px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px;align-items:center}
.pill{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:99px;font-size:13px;font-weight:600}
.pill.pending{background:var(--accent-soft);color:var(--accent)}
.pill.approved{background:var(--ok-soft);color:var(--ok)}
.pill.rejected{background:var(--no-soft);color:var(--no)}
.sname{font-family:var(--font-display);font-weight:600;font-size:18px;margin-top:8px}
.sdates{font-weight:500;margin-top:2px}
.track{display:grid;grid-template-columns:repeat(3,1fr);list-style:none;margin:0;padding:0}
.track li{position:relative;padding-top:20px;font-size:12px;color:var(--muted);text-align:center;line-height:1.3}
.track li::before{content:"";position:absolute;top:4px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--surface);border:2px solid var(--line);z-index:1}
.track li::after{content:"";position:absolute;top:9px;left:-50%;width:100%;height:2px;background:var(--line)}
.track li:first-child::after{display:none}
.track li.on{color:var(--ink)}
.track li.on::before{background:var(--ink);border-color:var(--ink)}
.track li.on::after{background:var(--ink)}
.track li.now::before{background:var(--accent);border-color:var(--accent)}
.track li.now::after{background:var(--ink)}
.track li.now{color:var(--accent);font-weight:600}
.track li.approved::before{background:var(--ok-fill);border-color:var(--ok-fill)} .track li.approved{color:var(--ok);font-weight:600}
.track li.rejected::before{background:var(--no);border-color:var(--no)} .track li.rejected{color:var(--no);font-weight:600}
.track li.approved::after,.track li.rejected::after{background:var(--ink)}
.reason{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--no-soft);color:var(--no);font-size:14px}
.reason.ok{background:var(--ok-soft);color:var(--ok)}

footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding-top:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:500;box-shadow:var(--shadow);z-index:40;max-width:calc(100vw - 32px)}
.toast[hidden]{display:none}

@media (max-width:900px){
  .review-grid,.submit-grid{grid-template-columns:minmax(0,1fr)}

<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/><path d="M8.5 14.5l2.2 2.2 4.3-4.4"/></svg>
      </span>
      <span class="brand-name">Leave Planner</span>
    </div>
    <nav class="tabs" aria-label="Screens">
      <a href="#submit" data-tab="submit">Request leave</a>
      <a href="#review" data-tab="review">Review <span class="badge" id="badge" hidden></span></a>
      <a href="#status" data-tab="status">Status</a>
    </nav>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
  <footer>
    <span>Prototype. Entries are saved in this browser only. Public holidays: Singapore (partial list through Feb 2027).</span>
    <button class="linkbtn" data-act="restore" type="button">Restore example data</button>
  </footer>
</div>
<div id="modal"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';
var KEY='leave-planner-v1';

/* ---------- helpers ---------- */
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pad=function(n){return String(n).padStart(2,'0')};
var iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parse=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
var addDays=function(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x};
var dayDiff=function(a,b){var A=parse(a),B=parse(b);return Math.round((Date.UTC(B.getFullYear(),B.getMonth(),B.getDate())-Date.UTC(A.getFullYear(),A.getMonth(),A.getDate()))/864e5)};
var TODAY=iso(new Date());

/* Singapore public holidays that fall on a weekday. Deepavali 2026 and Chinese New Year 2027 fall on weekends, so the Monday after is listed. */
var HOL={
  '2026-11-09':'Deepavali (observed)',
  '2026-12-25':'Christmas Day',
  '2027-01-01':"New Year's Day",
  '2027-02-08':'Chinese New Year (observed)'
};
var isWork=function(d){var w=d.getDay();return w>0&&w<6&&!HOL[iso(d)]};

function span(start,end){
  if(!start||!end)return null;
  var s=parse(start),e=parse(end);
  if(isNaN(s)||isNaN(e)||e<s)return null;
  var work=[],cal=0,hols=[];
  for(var d=s;d<=e;d=addDays(d,1)){
    cal++;
    if(isWork(d))work.push(iso(d));
    else if(HOL[iso(d)])hols.push(HOL[iso(d)]);
  }
  return {work:work,cal:cal,hols:hols};
}
function bounds(r){var sp=span(r.start,r.end);return sp&&sp.work.length?{s:sp.work[0],e:sp.work[sp.work.length-1],n:sp.work.length}:null}
function fDay(s,o){return parse(s).toLocaleDateString('en-GB',o||{weekday:'short',day:'numeric',month:'short'})}
function fRange(a,b){
  var full={weekday:'short',day:'numeric',month:'short'};
  if(a===b)return fDay(a,full);
  var A=parse(a),B=parse(b);
  if(A.getMonth()===B.getMonth()&&A.getFullYear()===B.getFullYear())return fDay(a,{weekday:'short',day:'numeric'})+' – '+fDay(b,full);
  return fDay(a,full)+' – '+fDay(b,full);
}
var fShort=function(s){return fDay(s,{day:'numeric',month:'short'})};
var first=function(n){return String(n).split(' ')[0]};
var initials=function(n){var p=String(n).trim().split(/\s+/);return (p[0][0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase()};
var plural=function(n,w){return n+' '+w+(n===1?'':'s')};

/* ---------- data ---------- */
function R(id,name,applied,start,end,status,decided,note,reason){return {id:id,name:name,applied:applied,start:start,end:end,status:status,decided:decided||null,note:note||'',reason:reason||''}}
function seed(){
  return {example:true,threshold:2,me:'',
    team:['Priya Nair','Daniel Lim','Mei Ling Tan','Raj Kumar','Aisha Rahman','Marcus Ong'],
    requests:[
      R('r1','Daniel Lim','2026-10-14','2026-11-12','2026-11-16','approved','2026-10-15','Family visit'),
      R('r2','Mei Ling Tan','2026-10-12','2026-11-09','2026-11-13','approved','2026-10-13'),
      R('r3','Raj Kumar','2026-10-26','2026-11-11','2026-11-13','pending',null,"Cousin's wedding"),
      R('r4','Aisha Rahman','2026-10-05','2026-11-23','2026-11-27','approved','2026-10-07'),
      R('r5','Marcus Ong','2026-10-27','2026-11-23','2026-11-24','pending',null,'Personal errand'),
      R('r6','Priya Nair','2026-10-20','2026-12-24','2026-12-31','approved','2026-10-20','Year-end break'),
      R('r7','Marcus Ong','2026-10-20','2026-10-29','2026-10-30','rejected','2026-10-21','Short trip','Release week, so I need the full team on deck. Happy to approve 6 Nov instead.'),
      R('r8','Aisha Rahman','2026-10-27','2026-11-12','2026-11-13','pending',null,'Passport renewal'),
      R('r9','Raj Kumar','2026-10-10','2026-11-02','2026-11-04','approved','2026-10-11','Moving house')
    ]};
}
function load(){
  try{var j=JSON.parse(localStorage.getItem(KEY));if(j&&Array.isArray(j.requests)&&Array.isArray(j.team))return j}catch(e){}
  return seed();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var S=load();

var ui={sel:null,month:null,calView:'month',filter:'all',who:null,modal:null,submitted:null,allDecided:false};
function pending(){return S.requests.filter(function(r){return r.status==='pending'}).sort(function(a,b){return a.applied<b.applied?-1:a.applied>b.applied?1:0})}
function initMonth(){var p=pending()[0];ui.month=(p?p.start:TODAY).slice(0,7)}
initMonth();

/* ---------- cover maths ---------- */
function awayOn(k,except){
  var names={};
  S.requests.forEach(function(x){if(x.status==='approved'&&x.start<=k&&k<=x.end&&x.name!==except)names[x.name]=1});
  return Object.keys(names);
}
/* people counted as away on a calendar day: approved leave plus the request under review */
function awayNames(k){
  if(!isWork(parse(k)))return [];
  var names={};
  S.requests.forEach(function(r){
    if(r.start<=k&&k<=r.end&&(r.status==='approved'||(r.status==='pending'&&r.id===ui.sel)))names[r.name]=1;
  });
  return Object.keys(names);
}
function impactOf(r){
  var sp=span(r.start,r.end),total=S.team.length,peak=0,over=[],who={};
  if(!sp)return {empty:true};
  sp.work.forEach(function(k){
    var names=awayOn(k,r.name);
    names.forEach(function(n){who[n]=1});
    var away=names.length+1;
    if(away>peak)peak=away;
    if(away>S.threshold)over.push({k:k,away:away});
  });
  return {empty:!sp.work.length,peak:peak,over:over,who:Object.keys(who),total:total,work:sp.work.length};
}
function dayList(arr,fmt){var s=arr.slice(0,3).map(fmt).join(', ');return arr.length>3?s+' and '+(arr.length-3)+' more':s}
var dayFmt=function(o){return fDay(o.k,{weekday:'short',day:'numeric',month:'short'})+' ('+o.away+')'};
function impactText(r){
  var im=impactOf(r);
  if(im.empty)return {cls:'',html:'This range has no working days.'};
  if(im.over.length)return {cls:'warn',html:'<strong>Over your limit.</strong> '+esc(first(r.name))+"'s leave would put up to "+im.peak+' of '+im.total+' away: '+esc(dayList(im.over,dayFmt))+'.'};
  if(im.who.length)return {cls:'fine',html:'<strong>Cover looks fine.</strong> Overlaps with '+esc(im.who.map(first).join(', '))+'; at most '+im.peak+' of '+im.total+' away.'};
  return {cls:'fine',html:'<strong>Cover looks fine.</strong> No one else is away on these days.'};
}
/* requester-facing wording for the form */
function formCheck(r){
  var im=impactOf(r);
  if(im.empty)return null;
  var pn=S.requests.filter(function(x){return x.status==='pending'&&x.name!==r.name&&x.start<=r.end&&x.end>=r.start}).length;
  var tail=pn?' '+plural(pn,'other request')+' for these dates '+(pn===1?'is':'are')+' still pending.':'';
  if(im.over.length)return {cls:'warn',html:'<strong>Heads up.</strong> Up to '+im.peak+' of '+im.total+' would be away: '+esc(dayList(im.over,dayFmt))+'. Your lead may ask you to adjust.'+tail};
  if(im.who.length)return {cls:'fine',html:'<strong>No clash.</strong> '+esc(im.who.map(first).join(', '))+' '+(im.who.length===1?'is':'are')+' also away in this period, but cover stays within the limit.'+tail};
  return {cls:'fine',html:'<strong>No clash.</strong> No one else is approved to be away in this period.'+tail};
}

/* ---------- shell ---------- */
var view=$('#view');
function renderBanner(){
  $('#banner').innerHTML=S.example
    ? '<div class="banner"><span>You are looking at example data for a team of '+S.team.length+'.</span><button class="linkbtn" data-act="clear" type="button">Start fresh</button></div>'
    : '';
}
function renderBadge(){var n=pending().length,b=$('#badge');b.textContent=n;b.hidden=!n}

/* ---------- Screen 1: request leave ---------- */
function awaySoon(){
  var list=S.requests.filter(function(r){return r.status==='approved'&&r.end>=TODAY}).sort(function(a,b){return a.start<b.start?-1:1}).slice(0,5);
  if(!list.length)return '<p class="muted" style="margin-top:12px">No approved leave coming up. Everyone is in.</p>';
  return '<div class="side-list">'+list.map(function(r){
    var n=(span(r.start,r.end)||{work:[]}).work.length;
    return '<div class="side-item"><div><b>'+esc(r.name)+'</b><div class="muted" style="font-size:14px">'+esc(fRange(r.start,r.end))+'</div></div><span class="dayspill">'+plural(n,'day')+'</span></div>';
  }).join('')+'</div>';
}
function renderSubmit(){
  var side='<aside class="card"><h2>Away soon</h2><p class="sub">Approved leave, so you can see who is already out.</p>'+awaySoon()+'</aside>';
  if(ui.submitted){
    var r=ui.submitted,n=(span(r.start,r.end)||{work:[]}).work.length;
    view.innerHTML='<div class="submit-grid"><section class="card done">'
      +'<span class="tick"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>'
      +'<h1>Request sent</h1><p class="sub">Your team lead can now see it on the calendar. You will see the decision on the Status screen.</p>'
      +'<div class="summary"><b>'+esc(r.name)+'</b><div>'+esc(fRange(r.start,r.end))+'</div><div class="muted">'+plural(n,'working day')+' · applied '+esc(fShort(r.applied))+'</div></div>'
      +'<div class="btnrow"><a class="btn primary" href="#status">Track this request</a><button class="btn" data-act="another" type="button">Submit another</button></div>'
      +'</section>'+side+'</div>';
    return;
  }
  var opts=S.team.map(function(n){return '<option value="'+esc(n)+'"></option>'}).join('');
  view.innerHTML='<div class="submit-grid"><section class="card">'
    +'<div class="head"><h1>Request leave</h1><p class="sub">Choose your dates. Duration counts working days only, and we check cover before you send.</p></div>'
    +'<form id="leaveForm" novalidate>'
    +'<div class="row2"><div class="field"><label for="f-name">Your name</label><input id="f-name" list="teamlist" autocomplete="off" placeholder="e.g. Raj Kumar" value="'+esc(S.me)+'"><datalist id="teamlist">'+opts+'</datalist></div>'
    +'<div class="field"><label for="f-applied">Application date</label><input id="f-applied" type="date" value="'+TODAY+'"></div></div>'
    +'<div class="row2 keep"><div class="field"><label for="f-start">Start date</label><input id="f-start" type="date"></div>'
    +'<div class="field"><label for="f-end">End date</label><input id="f-end" type="date"></div></div>'
    +'<div id="dur" class="dur idle" aria-live="polite"></div><div id="ovl" aria-live="polite"></div>'
    +'<div class="field"><label for="f-note">Note for your lead <span class="opt">(optional)</span></label><textarea id="f-note" rows="2" placeholder="Anything that helps with planning cover"></textarea></div>'
    +'<p id="err" class="err" role="alert" hidden></p>'
    +'<div class="formfoot"><div class="total" id="total" aria-live="polite"></div><button class="btn primary" type="submit">Send request</button></div>'
    +'</form></section>'+side+'</div>';
  updateDur();
}
function val(id){var e=document.getElementById(id);return e?e.value.trim():''}
function updateDur(){
  var box=$('#dur'),ovl=$('#ovl'),tot=$('#total');if(!box)return;
  var s=val('f-start'),e=val('f-end');
  if(!s||!e){
    box.className='dur idle';
    box.innerHTML='<div class="dur-num">–</div><div><div class="dur-t">Duration</div><div class="dur-s">Pick a start and end date to see it here.</div></div>';
    ovl.innerHTML='';tot.innerHTML='Request: <b>choose dates</b>';return;
  }
  var sp=span(s,e);
  if(!sp){
    box.className='dur bad';
    box.innerHTML='<div class="dur-num">!</div><div><div class="dur-t">End date is before the start date</div><div class="dur-s">Adjust one of the dates.</div></div>';
    ovl.innerHTML='';tot.innerHTML='Request: <b>check your dates</b>';return;
  }
  var n=sp.work.length;
  box.className='dur';
  var sub=esc(fRange(s,e))+' · '+plural(sp.cal,'calendar day')+'. Weekends'+(sp.hols.length?' and '+esc(sp.hols.join(', '))+' are':' and public holidays are')+' not counted.';
  box.innerHTML='<div class="dur-num">'+n+'</div><div><div class="dur-t">'+(n===1?'working day':'working days')+'</div><div class="dur-s">'+sub+'</div></div>';
  tot.innerHTML='Request: <b>'+plural(n,'working day')+'</b>';
  var c=n?formCheck({id:'tmp',name:val('f-name')||'__new__',start:s,end:e}):null;
  ovl.innerHTML=c?'<div class="preview '+c.cls+'"><span class="dot"></span><div>'+c.html+'</div></div>':'';
}
function submitForm(){
  var name=val('f-name'),applied=val('f-applied'),s=val('f-start'),e=val('f-end'),note=val('f-note'),err=$('#err');
  var msg='';
  if(!name)msg='Enter your name.';
  else if(!applied)msg='Enter the application date.';
  else if(!s||!e)msg='Choose a start and end date.';
  else if(!span(s,e))msg='The end date is before the start date.';
  else if(!span(s,e).work.length)msg='Those dates fall on weekends or public holidays, so there is no leave to take.';
  if(msg){err.textContent=msg;err.hidden=false;return}
  var r={id:'r'+Date.now(),name:name,applied:applied,start:s,end:e,status:'pending',decided:null,note:note,reason:''};
  S.requests.push(r);
  if(S.team.indexOf(name)<0)S.team.push(name);
  S.me=name;ui.who=name;ui.submitted=r;
  save();renderBadge();render();
}

/* ---------- Screen 2: review ---------- */
function monthRange(){var p=ui.month.split('-').map(Number);return {y:p[0],m:p[1],s:iso(new Date(p[0],p[1]-1,1)),e:iso(new Date(p[0],p[1],0)),dim:new Date(p[0],p[1],0).getDate()}}
function monthLabel(){var mr=monthRange();return new Date(mr.y,mr.m-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'})}
function leaveItems(){return S.requests.filter(function(r){return r.status!=='rejected'}).map(function(r){return {r:r,b:bounds(r)}}).filter(function(x){return x.b})}
function barKind(r){
  var ok=r.status==='approved';
  var tip=ok?'Change decision for '+r.name+': '+fRange(r.start,r.end):r.name+' (pending): '+fRange(r.start,r.end)+'. Select to preview';
  return {cls:ok?'ok':(r.id===ui.sel?'sel':'pend'),
    attrs:'data-act="'+(ok?'open-decision':'select')+'" data-id="'+r.id+'" data-keep="1" title="'+esc(tip)+'" aria-label="'+esc(tip)+'"'};
}
function monthHTML(){
  var mr=monthRange(),firstDay=new Date(mr.y,mr.m-1,1),lead=(firstDay.getDay()+6)%7,weeks=Math.ceil((lead+mr.dim)/7);
  var items=leaveItems();
  var html='<div class="mcal" role="group" aria-label="'+esc(monthLabel())+' team leave calendar"><div class="dowrow">'
    +['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(function(d){return '<div class="dow">'+d+'</div>'}).join('')+'</div>';
  for(var w=0;w<weeks;w++){
    var ws=addDays(firstDay,w*7-lead),wsK=iso(ws),weK=iso(addDays(ws,6));
    var segs=[];
    items.forEach(function(x){
      if(x.b.e<wsK||x.b.s>weK)return;
      var s=x.b.s>wsK?x.b.s:wsK,e=x.b.e<weK?x.b.e:weK;
      segs.push({r:x.r,c1:dayDiff(wsK,s)+1,c2:dayDiff(wsK,e)+1,l:x.b.s>=wsK,rr:x.b.e<=weK});
    });
    segs.sort(function(a,b){return a.c1-b.c1||(b.c2-b.c1)-(a.c2-a.c1)});
    var lanes=[];
    segs.forEach(function(sg){var li=0;while(lanes[li]!==undefined&&lanes[li]>=sg.c1)li++;lanes[li]=sg.c2;sg.lane=li});
    var bg='',dh='';
    for(var i=0;i<7;i++){
      var d=addDays(ws,i),k=iso(d),inM=d.getMonth()===mr.m-1,away=awayNames(k).length,over=away>S.threshold,hol=HOL[k];
      bg+='<div class="bgc'+(d.getDay()===0||d.getDay()===6?' wk':'')+(hol?' hol':'')+(over?' over':'')+'"></div>';
      dh+='<div class="dh'+(inM?'':' out')+(k===TODAY?' today':'')+'" style="grid-column:'+(i+1)+'"><div class="top-row"><span class="num">'+d.getDate()+'</span>'+(over?'<span class="tag">'+away+' away</span>':'')+'</div>'+(hol?'<div class="hol-l">'+esc(hol)+'</div>':'')+'</div>';
    }
    var bars=segs.map(function(sg){
      var bk=barKind(sg.r);
      return '<button class="bar '+bk.cls+(sg.l?' l':'')+(sg.rr?' r':'')+'" type="button" style="grid-column:'+sg.c1+' / '+(sg.c2+1)+';grid-row:'+(sg.lane+2)+'" '+bk.attrs+'><span class="full">'+esc(first(sg.r.name))+'</span><span class="ini">'+esc(initials(sg.r.name))+'</span></button>';
    }).join('');
    html+='<div class="week"><div class="wbg" aria-hidden="true">'+bg+'</div><div class="wfg">'+dh+bars+'</div></div>';
  }
  return html+'</div>';
}
function timelineHTML(){
  var mr=monthRange(),N=mr.dim,items=leaveItems();
  var head='<div class="tlrow tlhead"><div class="tname">Team</div>',count='<div class="tlrow tlcount"><div class="tname">Away of '+S.team.length+'</div>';
  for(var i=1;i<=N;i++){
    var d=new Date(mr.y,mr.m-1,i),k=iso(d),wk=d.getDay()===0||d.getDay()===6,hol=HOL[k],away=awayNames(k).length,over=away>S.threshold;
    var cls=(wk?' wk':'')+(hol?' hol':'')+(k===TODAY?' today':'');
    head+='<div class="tc'+cls+(over?' over':'')+'" style="grid-column:'+(i+1)+'"'+(hol?' title="'+esc(hol)+'"':'')+'><span>'+d.toLocaleDateString('en-GB',{weekday:'narrow'})+'</span><span class="tdn">'+i+'</span></div>';
    count+='<div class="tc'+(wk||hol?' wk':'')+(over?' over':'')+'" style="grid-column:'+(i+1)+'">'+(away||'·')+'</div>';
  }
  var rows='';
  S.team.forEach(function(name){
    var cells='<div class="tname" title="'+esc(name)+'">'+esc(name)+'</div>',bars='';
    for(var i=1;i<=N;i++){
      var d=new Date(mr.y,mr.m-1,i),k=iso(d),over=awayNames(k).length>S.threshold;
      cells+='<div class="tc'+(d.getDay()===0||d.getDay()===6||HOL[k]?' wk':'')+(over?' over':'')+'" style="grid-column:'+(i+1)+'"></div>';
    }
    items.filter(function(x){return x.r.name===name&&x.b.e>=mr.s&&x.b.s<=mr.e}).forEach(function(x){
      var s=x.b.s>mr.s?x.b.s:mr.s,e=x.b.e<mr.e?x.b.e:mr.e,bk=barKind(x.r);
      var c1=dayDiff(mr.s,s)+2,c2=dayDiff(mr.s,e)+2;
      bars+='<button class="tbar '+bk.cls+'" type="button" style="grid-column:'+c1+' / '+(c2+1)+'" '+bk.attrs+'><span class="full">'+plural(x.b.n,'day')+'</span></button>';
    });
    rows+='<div class="tlrow">'+cells+bars+'</div>';
  });
  return '<div class="tl-scroll" tabindex="0" role="group" aria-label="'+esc(monthLabel())+' timeline, one row per person"><div class="tl" style="--n:'+N+'">'+head+'</div>'+count+'</div>'+rows+'</div></div>';
}
function reqCard(r){
  var n=(span(r.start,r.end)||{work:[]}).work.length,im=impactOf(r),sel=r.id===ui.sel;
  var flag=im.empty?'':im.over.length?'<span class="imp warn"><i></i>Over limit on '+plural(im.over.length,'day')+'</span>':'<span class="imp fine"><i></i>Cover looks fine</span>';
  return '<div class="req'+(sel?' sel':'')+'" data-act="select" data-id="'+r.id+'" tabindex="0" role="button" aria-pressed="'+sel+'" aria-label="Show '+esc(r.name)+'\'s request on the calendar">'
    +'<div class="req-top"><span class="req-name">'+esc(r.name)+'</span><span class="req-days">'+plural(n,'working day')+'</span></div>'
    +'<div class="req-dates">'+esc(fRange(r.start,r.end))+'</div>'
    +(r.note?'<div class="req-note">'+esc(r.note)+'</div>':'')
    +'<div class="req-note">Applied '+esc(fShort(r.applied))+'</div>'
    +'<div class="req-foot">'+flag+'<button class="btn sm primary" type="button" data-act="open-decision" data-id="'+r.id+'">Review</button></div></div>';
}
function renderReview(){
  var pend=pending();
  if(!pend.some(function(r){return r.id===ui.sel}))ui.sel=pend.length?pend[0].id:null;
  var selReq=pend.filter(function(r){return r.id===ui.sel})[0],mr=monthRange();
  var any=leaveItems().some(function(x){return x.b.e>=mr.s&&x.b.s<=mr.e});
  var prev=selReq?(function(){var t=impactText(selReq);return '<div class="preview '+t.cls+'"><span class="dot"></span><div><div class="eyebrow" style="margin-bottom:2px">Previewing '+esc(selReq.name)+' · '+esc(fRange(selReq.start,selReq.end))+'</div>'+t.html+'</div></div>'})()
    : '<div class="preview"><span class="dot"></span><div>No request is selected. Pick one from the list to see how it changes cover.</div></div>';
  var opts=[1,2,3,4,5].map(function(n){return '<option value="'+n+'"'+(n===S.threshold?' selected':'')+'>'+n+'</option>'}).join('');
  var decidedAll=S.requests.filter(function(r){return r.status!=='pending'&&r.decided}).sort(function(a,b){return a.decided<b.decided?1:-1});
  var decided=ui.allDecided?decidedAll:decidedAll.slice(0,4);
  var queue=pend.length?pend.map(reqCard).join('')
    : '<div class="card empty"><svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="34" fill="var(--accent-soft)"/><circle cx="36" cy="30" r="9" fill="var(--accent)"/><path d="M10 50c8-8 16-8 26 0s18 8 26 0" fill="none" stroke="var(--ok-fill)" stroke-width="3" stroke-linecap="round"/></svg><h3>All caught up</h3><p>No requests are waiting for a decision. New ones will appear here as soon as they are sent.</p></div>';
  var pressed=function(v){return ui.calView===v};
  view.innerHTML='<div class="head"><h1>Review</h1><p class="sub">Select a request to see it on the calendar, then open it to approve or reject.</p></div>'
    +'<div class="review-grid"><section class="card">'
    +'<div class="calbar"><div class="calnav"><button class="iconbtn" data-act="prev" aria-label="Previous month" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><span class="monthlbl">'+esc(monthLabel())+'</span><button class="iconbtn" data-act="next" aria-label="Next month" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button><button class="btn sm ghost" data-act="today" type="button">Today</button></div>'
    +'<div class="calopts"><div class="seg" role="group" aria-label="Calendar view"><button type="button" data-act="view" data-v="month" aria-pressed="'+pressed('month')+'">Month</button><button type="button" data-act="view" data-v="timeline" aria-pressed="'+pressed('timeline')+'">Timeline</button></div>'
    +'<label class="limit" for="limit">Flag days when more than <select id="limit">'+opts+'</select> of '+S.team.length+' are away</label></div></div>'
    +prev
    +'<div class="legend"><span><i class="sw ok"></i>Approved</span><span><i class="sw pend"></i>Pending</span><span><i class="sw sel"></i>Under review</span><span><i class="sw over"></i>Over your limit</span></div>'
    +(ui.calView==='timeline'?timelineHTML():monthHTML())
    +(any?'<p class="hint">Select an approved bar to change that decision.</p>':'<p class="calnote">No one is away this month.</p>')
    +'</section>'
    +'<aside class="queue"><div class="qhead"><h2>Waiting for you</h2><span class="count">'+plural(pend.length,'request')+'</span></div>'+queue
    +(decided.length?'<div class="card"><h3>'+(ui.allDecided?'All decided':'Recently decided')+'</h3><p class="meta" style="margin-top:2px">Select one to change the decision.</p><div class="decided" style="margin-top:8px">'+decided.map(function(r){return '<button class="row" type="button" data-act="open-decision" data-id="'+r.id+'"><span><b>'+esc(first(r.name))+'</b> · '+esc(fRange(r.start,r.end))+'</span><span class="pill '+r.status+'">'+(r.status==='approved'?'Approved':'Rejected')+'</span></button>'}).join('')+(decidedAll.length>4?'<button class="linkbtn more" data-act="all-decided" type="button">'+(ui.allDecided?'Show fewer':'Show all '+decidedAll.length)+'</button>':'')+'</div></div>':'')
    +'</aside></div>';
}
function decide(id,status,message){
  var r=S.requests.filter(function(x){return x.id===id})[0];if(!r)return;
  var prev=r.status;
  if(prev!=='pending')r.changed={from:prev==='rejected'?'not approved':prev,on:TODAY};
  r.status=status;r.decided=status==='pending'?null:TODAY;r.reason=status==='pending'?'':(message||'');
  if(status==='pending')ui.sel=id;
  ui.modal=null;save();renderBadge();
  var who=first(r.name)+"'s request";
  toast(status==='pending'?'Returned '+who+' to pending.':prev==='pending'?(status==='approved'?'Approved ':'Rejected ')+who+'.':'Changed '+who+' to '+(status==='approved'?'approved':'rejected')+'.');
  keepScroll(render);
}

/* decision sheet: one place to decide, or change a decision already made */
function renderModal(){
  var host=$('#modal'),r=ui.modal&&S.requests.filter(function(x){return x.id===ui.modal})[0];
  if(!r||route()!=='review'){host.innerHTML='';return}
  var sp=span(r.start,r.end)||{work:[],cal:0},im=impactOf(r),t=impactText(r),cur=r.status,label={approved:'Approved',rejected:'Not approved',pending:'Pending'}[cur];
  var cover=im.empty?'No working days':im.over.length?'Over limit: up to '+im.peak+' of '+im.total+' away':'Within limit: at most '+im.peak+' of '+im.total+' away';
  var rows='<dt>Requested by</dt><dd>'+esc(r.name)+'</dd>'
    +'<dt>Applied</dt><dd>'+esc(fShort(r.applied))+'</dd>'
    +'<dt>Dates</dt><dd>'+esc(fRange(r.start,r.end))+'</dd>'
    +'<dt>Duration</dt><dd>'+plural(sp.work.length,'working day')+' <span class="muted">('+plural(sp.cal,'calendar day')+')</span></dd>'
    +'<dt>Cover</dt><dd style="color:var(--'+(im.over&&im.over.length?'accent':'ok')+')">'+esc(cover)+'</dd>'
    +(r.note?'<dt>Note</dt><dd>'+esc(r.note)+'</dd>':'')
    +'<dt>Approver</dt><dd>Team lead</dd>'
    +(cur!=='pending'&&r.decided?'<dt>Decision</dt><dd>'+label+' on '+esc(fShort(r.decided))+'</dd>':'');
  host.innerHTML='<div class="scrim" data-act="close-modal"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt" tabindex="-1">'
    +'<div class="sheet-top"><div><div class="eyebrow">'+(cur==='pending'?'Review request':'Change decision')+'</div><h2 id="mt">'+esc(r.name)+'</h2></div><button class="iconbtn" data-act="close-modal" aria-label="Close" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>'
    +'<dl class="kv">'+rows+'</dl>'
    +'<div class="preview '+t.cls+'"><span class="dot"></span><div>'+t.html+'</div></div>'
    +'<div class="field"><label for="mmsg">Message to requester <span class="opt">(optional)</span></label><textarea id="mmsg" rows="3" placeholder="e.g. Approved. Please hand over the weekly report first.">'+esc(r.reason)+'</textarea></div>'
    +'<div class="sheet-foot">'+(cur!=='pending'?'<button class="linkbtn" data-act="m-pending" data-id="'+r.id+'" type="button">Return to pending</button>':'')
    +'<button class="btn rej" data-act="m-decide" data-s="rejected" data-id="'+r.id+'" type="button"'+(cur==='rejected'?' disabled':'')+'>'+(cur==='rejected'?'Rejected':'Reject')+'</button>'
    +'<button class="btn ok" data-act="m-decide" data-s="approved" data-id="'+r.id+'" type="button"'+(cur==='approved'?' disabled':'')+'>'+(cur==='approved'?'Approved':'Approve')+'</button></div>'
    +'</div></div>';
  var sh=host.querySelector('.sheet');if(sh)sh.focus();
}

/* ---------- Screen 3: status ---------- */
function renderStatus(){
  if(ui.who==null)ui.who=S.me||'all';
  var names=S.team.slice().sort();
  var mine=S.requests.filter(function(r){return ui.who==='all'||r.name===ui.who});
  var cnt={all:mine.length,pending:0,approved:0,rejected:0};
  mine.forEach(function(r){cnt[r.status]++});
  var list=mine.filter(function(r){return ui.filter==='all'||r.status===ui.filter})
    .sort(function(a,b){var o={pending:0,approved:1,rejected:1};return o[a.status]-o[b.status]||(a.applied<b.applied?1:-1)});
  var fl=[['all','All'],['pending','Pending'],['approved','Approved'],['rejected','Rejected']].map(function(f){
    return '<button class="fbtn" data-act="filter" data-f="'+f[0]+'" aria-pressed="'+(ui.filter===f[0])+'" type="button">'+f[1]+' '+cnt[f[0]]+'</button>';
  }).join('');
  var body;
  if(!mine.length){
    body='<div class="card empty"><svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="34" fill="var(--accent-soft)"/><rect x="18" y="20" width="36" height="32" rx="7" fill="var(--surface)" stroke="var(--accent)" stroke-width="3"/><path d="M26 16v8M46 16v8M18 31h36" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/></svg><h3>No leave requests yet</h3><p>'+(ui.who==='all'?'When anyone submits a request, it shows up here.':'When '+esc(first(ui.who))+' submits a request, you can follow it here.')+'</p><a class="btn primary" href="#submit">Request leave</a></div>';
  }else if(!list.length){
    body='<div class="card empty"><h3>Nothing '+ui.filter+' right now</h3><p>Try another filter to see the rest.</p></div>';
  }else{
    body='<div class="stack">'+list.map(statusCard).join('')+'</div>';
  }
  view.innerHTML='<div class="head"><h1>Request status</h1><p class="sub">See where each leave request stands.</p></div>'
    +'<div class="statusbar"><div class="who"><label for="who">Showing requests for</label><select id="who"><option value="all"'+(ui.who==='all'?' selected':'')+'>Everyone</option>'+names.map(function(n){return '<option value="'+esc(n)+'"'+(ui.who===n?' selected':'')+'>'+esc(n)+'</option>'}).join('')+'</select></div><div class="filters">'+fl+'</div></div>'
    +body;
}
function statusCard(r){
  var n=(span(r.start,r.end)||{work:[]}).work.length;
  var label={pending:'Pending',approved:'Approved',rejected:'Not approved'}[r.status];
  var t2,t3;
  if(r.status==='pending'){t2='<li class="now">With team lead<br>Waiting</li>';t3='<li>Decision</li>'}
  else{t2='<li class="on">Reviewed<br>'+esc(fShort(r.decided||TODAY))+'</li>';t3='<li class="'+r.status+'">'+(r.status==='approved'?'Approved':'Not approved')+'</li>'}
  return '<article class="card srow"><div><span class="pill '+r.status+'">'+label+'</span>'
    +'<div class="sname">'+esc(ui.who==='all'?r.name:fRange(r.start,r.end))+'</div>'
    +'<div class="sdates">'+esc(ui.who==='all'?fRange(r.start,r.end):plural(n,'working day'))+'</div>'
    +'<div class="muted" style="font-size:14px">'+(ui.who==='all'?plural(n,'working day')+' · ':'')+'Applied '+esc(fShort(r.applied))+(r.note?' · '+esc(r.note):'')+'</div>'
    +(r.status!=='pending'&&r.reason?'<div class="reason'+(r.status==='approved'?' ok':'')+'"><b>From your lead:</b> '+esc(r.reason)+'</div>':'')
    +(r.changed?'<div class="muted" style="font-size:13px;margin-top:8px">'+(r.status==='pending'?'Reopened '+esc(fShort(r.changed.on))+' for another look. Earlier decision: '+esc(r.changed.from)+'.':'Decision updated '+esc(fShort(r.decided||r.changed.on))+'. Earlier decision: '+esc(r.changed.from)+'.')+'</div>':'')
    +'</div><ol class="track" aria-label="Progress"><li class="on">Submitted<br>'+esc(fShort(r.applied))+'</li>'+t2+t3+'</ol></article>';
}

/* ---------- routing + events ---------- */
function route(){var h=(location.hash||'').replace('#','');return ['submit','review','status'].indexOf(h)>-1?h:'review'}
function render(){
  var r=route();
  document.querySelectorAll('[data-tab]').forEach(function(a){
    if(a.dataset.tab===r)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');
  });
  renderBanner();renderBadge();
  if(r==='submit')renderSubmit();else if(r==='review')renderReview();else renderStatus();
  renderModal();
}
function keepScroll(fn){var y=window.scrollY;fn();window.scrollTo(0,y)}
var tt;
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},2800)}
function shiftMonth(n){var p=ui.month.split('-').map(Number),d=new Date(p[0],p[1]-1+n,1);ui.month=d.getFullYear()+'-'+pad(d.getMonth()+1)}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,id=el.dataset.id;
  if(el.classList.contains('scrim')&&e.target!==el)return;
  if(a==='select'){
    ui.sel=id;
    if(!el.dataset.keep){var r=S.requests.filter(function(x){return x.id===id})[0];if(r)ui.month=r.start.slice(0,7)}
    keepScroll(render);
  }
  else if(a==='open-decision'){ui.modal=id;keepScroll(render)}
  else if(a==='close-modal'){ui.modal=null;keepScroll(render)}
  else if(a==='m-decide'){var m=document.getElementById('mmsg');decide(id,el.dataset.s,m?m.value.trim():'')}
  else if(a==='m-pending'){decide(id,'pending')}
  else if(a==='prev'){shiftMonth(-1);keepScroll(render)}
  else if(a==='next'){shiftMonth(1);keepScroll(render)}
  else if(a==='today'){ui.month=TODAY.slice(0,7);keepScroll(render)}
  else if(a==='view'){ui.calView=el.dataset.v;keepScroll(render)}
  else if(a==='filter'){ui.filter=el.dataset.f;keepScroll(render)}
  else if(a==='all-decided'){ui.allDecided=!ui.allDecided;keepScroll(render)}
  else if(a==='another'){ui.submitted=null;render()}
  else if(a==='clear'){S.requests=[];S.example=false;save();initMonth();ui.sel=null;render();toast('Example data cleared. The calendar is empty.')}
  else if(a==='restore'){S=seed();save();ui={sel:null,month:null,calView:ui.calView,filter:'all',who:null,modal:null,submitted:null,allDecided:false};initMonth();render();toast('Example data restored.')}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&ui.modal){ui.modal=null;render();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.req[data-act="select"]')){e.preventDefault();e.target.click()}
});
document.addEventListener('submit',function(e){if(e.target.id==='leaveForm'){e.preventDefault();submitForm()}});
document.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='f-start'||id==='f-end'||id==='f-name'){
    if(id==='f-start'){var en=document.getElementById('f-end');if(en&&(!en.value||en.value<e.target.value))en.value=e.target.value}
    updateDur();var er=$('#err');if(er)er.hidden=true;
  }
});
document.addEventListener('change',function(e){
  var id=e.target.id;
  if(id==='limit'){S.threshold=Number(e.target.value);save();keepScroll(render)}
  else if(id==='who'){ui.who=e.target.value;if(ui.who!=='all'){S.me=ui.who;save()}render()}
  else if(id==='f-start'||id==='f-end'){updateDur()}
});
window.addEventListener('hashchange',function(){ui.submitted=null;ui.modal=null;render();window.scrollTo(0,0)});
render();
})();
</script>
</body>
</html>
